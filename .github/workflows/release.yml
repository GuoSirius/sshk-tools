name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.0）'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            label: win-x64
          - os: macos-latest
            arch: universal
            label: mac-universal
          - os: ubuntu-latest
            arch: x64
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 启用 pnpm (latest)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: 安装依赖（lockfile 必须一致）
        run: pnpm install --frozen-lockfile

      - name: 门禁
        run: pnpm verify

      - name: 清理陈旧产物（避免 stale dist 混入）
        shell: bash
        run: rm -rf dist

      - name: 构建三端产物
        run: pnpm --filter @sshk/desktop build

      - name: 打包安装包（D6：无签名，签名位留开关）
        run: pnpm --filter @sshk/desktop exec electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 拿到证书后填入仓库 Secrets 即可启用，无需改代码：
          # WIN_CSC_FILE / WIN_CSC_KEY_PASSWORD / CSC_LINK / CSC_KEY_PASSWORD

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          # electron-builder.yml directories.output 指向仓库根 dist/（../../dist），不是 apps/desktop/dist
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Release 正文用仓库 CHANGELOG.md 顶部段（release.mjs 生成的新格式本版本说明）
      - name: 提取本版本 changelog
        run: |
          awk '/^## /{if (found) exit; found=1} found{print}' CHANGELOG.md > release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          # tag 推送触发时用 github.ref_name；手动 dispatch 时用输入的 tag（修复后重跑需指定 v1.1.0）
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          body_path: release-body.md
          files: artifacts/*
