<!doctype html>
<!-- 预置 dark：默认暗黑（需求 3），避免配置异步读取前的首帧闪白；useTheme 加载后按用户设置校正 -->
<html lang="zh-CN" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- script-src 必须放行 blob:：运行时工具包（.sshktool）的渲染层经 Blob URL 动态 import，
         内容来自安装时已通过契约校验的本机包，非远程脚本 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' blob:" />
    <title>sshk-tools</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
