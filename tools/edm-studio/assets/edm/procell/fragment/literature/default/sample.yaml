overview_title: 'Low-dose oral nicotinamide mononucleotide for immune thrombocytopenia: a phase 1/2 trial'
overview_link: https://www.nature.com/articles/s41467-026-70340-3
overview_publicationDate: April 29 2026
overview_journal: Nature Medicine
overview_impactFactor: 50
overview_doi: 10.1038/s41591-026-04366-x
overview_keywords: Immune Thrombocytopenia (ITP), Nicotinamide Mononucleotide (NMN), CD38-NAD<sup>+</sup> Axis
information_imageWidth: 40%
information_image:
  - https://pri-cella.oss-ap-southeast-1.aliyuncs.com/edm/202604211419/information.webp
information_content: 'This study identifies the CD38-NAD<sup>+</sup> axis as an immunometabolic checkpoint in ITP. Anti-CD38 antibodies deplete NAD<sup>+</sup>, driving M1 macrophages and FcγRI upregulation, which increases platelet phagocytosis. Restoring NAD<sup>+</sup> via CD38 inhibition or NMN reprograms macrophages to a resting state and blocks platelet destruction without affecting humoral immunity. In 25 refractory ITP patients, low-dose NMN (450 mg bid × 2 weeks) was well tolerated: 20% achieved platelets ≥50×10<sup>9</sup>/L, and 52% maintained response at week 8, with stable immunoglobulin levels. Thus, targeting CD38-NAD<sup>+</sup> metabolism offers a non-antibody-depleting therapeutic strategy.'
