version: 1
code: default
name: 上新推广·迁移版
changelog: juice-cli/edm series 迁移（plans/14）
fields:
  - type: image
    key: bannerImage
    label: banner 图
    required: false
  - type: url
    key: bannerLink
    label: banner 链接
    required: false
  - type: richtext
    key: abstractInformation
    label: 摘要信息
    required: false
  - type: input
    key: wordCloudTitle
    label: 词云标题
    required: false
    default: Indicators
  - type: input
    key: wordCloudTitleClassName
    label: 词云标题类名
    required: false
    default: title
  - type: switch
    key: wordCloudNeedCondensed
    label: 词云紧凑模式
    required: false
    default: true
  - type: repeater
    key: wordCloudLists
    label: 词云列表
    required: false
    itemFields:
      - type: input
        key: text
        label: 文字
        required: false
      - type: color
        key: color
        label: 颜色
        required: false
      - type: url
        key: link
        label: 链接
        required: false
  - type: input
    key: advantageTitle
    label: 优势标题
    required: false
    default: 'Designed for Multicolor Panel Flexibility, These Antibodies Offer:'
  - type: input
    key: advantageTitleClassName
    label: 优势标题类名
    required: false
    default: title
  - type: input
    key: advantageItemClassName
    label: 优势项类名
    required: false
    default: circle
  - type: repeater
    key: advantageLists
    label: 优势列表
    required: false
    itemFields:
      - type: input
        key: value
        label: 优势项
        required: false
  - type: input
    key: indicatorTitle
    label: 指标标题
    required: false
    default: New Indicators Introduction (Paticial)
  - type: input
    key: indicatorTitleClassName
    label: 指标标题类名
    required: false
    default: title
  - type: input
    key: indicatorItemClassName
    label: 指标项类名
    required: false
    default: gold-star
  - type: repeater
    key: indicatorLists
    label: 指标列表
    required: false
    itemFields:
      - type: input
        key: value
        label: 指标项
        required: false
  - type: number
    key: perRowCount
    label: 每行展示数量
    required: false
  - type: repeater
    key: productLists
    label: 产品列表
    required: false
    itemFields:
      - type: image
        key: image
        label: 图片
        required: false
      - type: input
        key: name
        label: 名称
        required: false
      - type: url
        key: link
        label: 链接
        required: false
      - type: input
        key: buttonText
        label: 按钮文字
        required: false












