version: 1
code: default
name: 文献推广
fields:
  - type: image
    key: coverImage
    label: 封面图
    required: false
  - type: textarea
    key: literatureTitle
    label: 文献标题
    required: false
  - type: url
    key: literatureLink
    label: 文献链接
    required: false
  - type: input
    key: publicationDate
    label: 发布日期
    required: false
  - type: input
    key: journal
    label: 期刊
    required: false
  - type: input
    key: impactFactor
    label: 影响因子
    required: false
  - type: input
    key: doi
    label: DOI
    required: false
  - type: textarea
    key: literatureKeywords
    label: 文献关键词
    required: false
  - type: input
    key: imageColumnWidth
    label: 图片列宽
    required: false
  - type: image-list
    key: detailImageLists
    label: 详情图册
    required: false
  - type: richtext
    key: literatureAbstract
    label: 文献摘要
    required: false
  - type: input
    key: abstractButtonText
    label: 摘要按钮文本
    required: false
    default: View More Publications
  - type: url
    key: abstractButtonLink
    label: 摘要按钮链接
    required: false
  - type: richtext
    key: literatureSummary
    label: 文献小节
    required: false
  - type: input
    key: literatureProductTitle
    label: 文献产品标题
    required: false
  - type: repeater
    key: literatureProductLists
    label: 文献产品列表
    required: false
    itemFields:
      - type: input
        key: name
        label: 名称
        required: false
      - type: input
        key: catNo
        label: 货号
        required: false
      - type: url
        key: link
        label: 链接
        required: false
policy:
  blacklist: []
  whitelist: []


























