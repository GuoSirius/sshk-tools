abstractInformation:
  - value: High quality immune cell isolation is essential for reliable downstream research. The right isolation strategy helps preserve cell identity and function, giving you greater confidence in your experimental results.
  - value: Join our upcoming webinar to learn how immune cell isolation methods can improve sample quality and support applications such as immune profiling, functional assays, and cell analysis.
introductionTitle: In this webinar, you will learn
introductionTitleClassName: color-black
introductionLists:
  - value: <span class="color-blue text-size-[12px]">·</span>Approaches for isolating immune cell populations with high purity
  - value: <span class="color-blue text-size-[12px]">·</span>How to maintain cell identity and biological function throughout isolation
  - value: <span class="color-blue text-size-[12px]">·</span>Examples of downstream applications using isolated immune cells
