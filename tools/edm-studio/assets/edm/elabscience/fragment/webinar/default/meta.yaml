  - type: url
    key: introductionButtonLink
    label: 介绍按钮链接
    required: false
  - type: input
    key: reserveTitle
    label: 预定标题
    required: false
    default: Secure Your Spot
  - type: input
    key: reserveTitleClassName
    label: 预定标题类名
    required: false
    default: color-black
  - type: input
    key: reserveItemClassName
