    label: 好消息
    required: false
  - type: image
    key: speakerAvatar
    label: 发言者头像
    required: false
  - type: input
    key: speakerUsername
    label: 发言者用户名
    required: false
  - type: input
    key: speakerJobTitle
    label: 发言者职称
    required: false
  - type: url
    key: registerLink
