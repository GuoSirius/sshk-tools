version: 1
changelog: 改为响应式内联结构
fields:
  - type: input
    key: title
    label: 主标题
    required: true
    placeholder: 请输入邮件主标题
    maxLength: 30
  - type: input
    key: subtitle
    label: 副标题
    required: false
    placeholder: 选填
    maxLength: 40
  - type: textarea
    key: intro
    label: 引导文案
    required: false
    placeholder: 一段简短的引导文字
    maxLength: 120
  - type: richtext
    key: body
    label: 正文
    required: false
  - type: radio
    key: theme
    label: 主题色
    required: true
    options:
      - label: 科技蓝
        value: blue
      - label: 活力绿
        value: green
      - label: 暖橙
        value: orange
  - type: checkbox
    key: channels
    label: 投放渠道
    required: false
    options:
      - label: 微信公众号
        value: wechat
      - label: 邮件
        value: email
      - label: 官网
        value: web
    maxChecked: 2
  - type: select
    key: category
    label: 内容分类
    required: false
    options:
      - label: 新品发布
        value: new
      - label: 促销活动
        value: promo
      - label: 品牌活动
        value: event
  - type: select-multi
    key: tags
    label: 标签
    required: false
    options:
      - label: 科研
        value: research
      - label: 细胞
        value: cell
      - label: 蛋白
        value: protein
    maxSelected: 3
  - type: image
    key: hero
    label: 头图
    required: true
  - type: image-list
    key: gallery
    label: 图片墙
    required: false
    max: 3
  - type: list
    key: products
    label: 推荐产品
    required: false
    minRows: 1
    maxRows: 5
    itemFields:
      - type: input
        key: name
        label: 产品名
        required: true
      - type: input
        key: url
        label: 链接
        required: false
        pattern: ^https?://
      - type: image
        key: cover
        label: 产品图
        required: false
  - type: input
    key: field_1
    label: 新字段 12
    required: false
name: 新版v1
code: v1


