packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# pnpm 12 默认不执行依赖的构建脚本；需要跑 install/postinstall 的依赖在此显式放行。
# - electron: postinstall 下载运行时二进制，不放行则 electron/dist 为空，pnpm dev 起不来
# - esbuild: postinstall 安装平台二进制
# - electron-winstaller: install 脚本 select-7z-arch.js 选择 7z 架构二进制（electron-builder 传递依赖）
# 注意：allowBuilds 是 pnpm 12 的规范写法，与 onlyBuiltDependencies 不必同时存在。
allowBuilds:
  vue-demi: true
  electron: true
  esbuild: true
  electron-winstaller: true
  # koffi：install 脚本从包内预编译二进制复制到 build/koffi（无需 node-gyp / 联网）
  koffi: true
  # es5-ext 的 postinstall 仅打印赞助横幅，无实际构建，显式拒绝（2026-11-15 wangeditor 依赖链引入）
  es5-ext: false
  # ssh2 / cpu-features（2026-11-15 B0 引入 ssh2 时由 cph 门禁实测发现 ERR_PNPM_IGNORED_BUILDS）：
  # - cpu-features 是 ssh2 的 optional 原生加速模块，install = node-gyp rebuild，Windows 上易失败且非必需，ssh2 会自动回退纯 JS
  # - ssh2 的 install.js 仅探测/编译该加速模块，拒绝后不影响 sftp 功能
  # 二者显式 false 拒绝（与 es5-ext 同策略），避免 pnpm 12 每次跑脚本都报 ignored builds
  cpu-features: false
  ssh2: false

# 安全治理：
# - GHSA-g3hv-75wg-m249（minimatch <11.0.1 moderate），经 @typescript-eslint dev 链引入
# - GHSA-p98j-92pf-mc4p 等 5 项（dompurify <=3.4.16，1 critical/1 high/3 low），经 monaco-editor 间接引入 edm-studio
overrides:
  minimatch: ^11.0.1
  dompurify: ">=3.4.17"
  # Dependabot security_update_not_possible（2026-11-15）：esdk-obs-nodejs@3.26.10
  # 把 fast-xml-parser 精确 pin 在 5.3.7（漏洞需 >=5.12.0），间接依赖无法单独升级。
  # 统一 override 到无漏洞版本；5.x 内 XMLParser API 向后兼容，已实测 OBS SDK 可加载。
  fast-xml-parser: ">=5.12.0"
  # Dependabot security_update_not_possible（2026-11-24）：@wangeditor/core@1.1.19
  # 把 i18next 约束写死为 ^20.4.0（lock 解析 20.6.1），漏洞需 >=26.3.4，上游 latest 未修，间接依赖无法单独升级。
  # 统一 override 到 26.x 最低安全版；锁 ^26 避免跳到 27.x（node>=22），待 pnpm verify 实测 wangeditor 兼容性。
  i18next: "^26.3.4"

# 依赖版本策略：所有外部 npm 包在各自 package.json 中一律写 "latest"，
# 由 pnpm-lock.yaml 固定实际版本，CI 使用 --frozen-lockfile 保证可复现。
